<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Contract Redline Copilot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>✍️ Contract Redline Copilot</h1><p>Paste a liability clause — get suggested redlines vs a standard playbook.</p><textarea id="c" rows="4" placeholder="e.g. Vendor shall have unlimited liability for all damages..."></textarea><br><button onclick="go()">Suggest redlines</button><div id="out"></div><script>function go(){const c=document.getElementById('c').value.toLowerCase();let out=[];if(/unlimited/.test(c))out.push('🔴 Cap liability at 12 months of fees (fallback: 24 months)');if(/all damages|any damages/.test(c))out.push('🔴 Exclude indirect/consequential damages');if(!/cap|limit/.test(c))out.push('🟡 No liability cap detected — add mutual cap');if(/sole remedy|exclusive/.test(c))out.push('🟡 Review exclusive remedy language');if(!out.length)out.push('🟢 Clause within playbook tolerance');document.getElementById('out').textContent=out.join('\n')+'\n\nFull playbook redlining & approval routing: commercial@ziontechgroup.com'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/contract-redline-copilot">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-contract-reviewer/">Contract Reviewer</a></p></body></html>
