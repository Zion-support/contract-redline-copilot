<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Contract Redline Copilot</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>✒️ Contract Redline Copilot</h1><p>Paste a clause; get redline suggestions vs a standard playbook.</p><textarea id="c" rows="4" placeholder="e.g. Vendor shall have unlimited liability for all damages..."></textarea><br><button onclick="go()">Redline</button><div id="out"></div><script>function go(){const c=document.getElementById('c').value.toLowerCase();let out=[];if(/unlimited liability/.test(c))out.push('🔴 Cap liability at 12 months of fees — fallback: 24 months');if(/indemnif/.test(c))out.push('🟡 Make indemnification mutual and exclude consequential damages');if(/perpetual|irrevocable/.test(c))out.push('🔴 Replace perpetual license with term-limited license');if(/non-?compete/.test(c))out.push('🟡 Narrow non-compete scope to named competitors, 12 months max');if(!out.length)out.push('✅ Clause aligns with playbook — no redline needed');document.getElementById('out').textContent=out.join('\n')+'\n\nFull playbook automation + approval routing: commercial@ziontechgroup.com'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/contract-redline-copilot">GitHub</a> · <a href="https://ziontechgroup.com/ai-legal-advisor/">Legal Advisor</a></p></body></html>
